services:
  mongodb:
    image: mongo:7
    container_name: pet-health-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - pet-health-network

  redis:
    image: redis:7-alpine
    container_name: pet-health-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pet-health-network

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: pet-health-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=mongodb://admin:password123@mongodb:27017/pet-health?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-production-secret-key-change-me
      - JWT_EXPIRES_IN=7d
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
    networks:
      - pet-health-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: pet-health-web
    restart: unless-stopped
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - pet-health-network

  nginx:
    image: nginx:alpine
    container_name: pet-health-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - server
    networks:
      - pet-health-network

volumes:
  mongodb_data:

networks:
  pet-health-network:
    driver: bridge
